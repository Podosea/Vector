name: Stealth Build

# 自用隐匿构建：只从 stealth-* 分支或手动触发，不参与上游发布链。
on:
  workflow_dispatch:
  push:
    branches: [ 'stealth-*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 版本串只带 pushed commit：从 P11 起「是不是 CI」由 GITHUB_ACTIONS 判定，不再靠
      # 仓库串是否为空——那条判据被置空后会把每个 CI 构建都当成本地构建，从而把 runner
      # 主机名（runnervm8k3b6）当成本地机器名拼进 module.prop。
      VECTOR_BUILD_COMMIT: ${{ github.sha }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          ALIAS: xpprivate
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_STORE" ]; then
            echo "::error::SIGNING_KEYSTORE 为空。隐匿构建必须签名（manager.apk 与模块同签才被 daemon 加载）。"
            exit 1
          fi
          {
            echo "androidStorePassword=$KEY_STORE_PASSWORD"
            echo "androidKeyAlias=$ALIAS"
            echo "androidKeyPassword=$KEY_PASSWORD"
            echo "androidStoreFile=key.jks"
          } >> gradle.properties
          printf '%s' "$KEY_STORE" | base64 --decode > key.jks

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Gradle properties
        run: |
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: 1.13.2

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Remove Android's cmake
        shell: bash
        run: rm -rf $ANDROID_HOME/cmake

      - name: Build with Gradle
        run: ./gradlew zipAll

      - name: Static identity scan
        run: |
          set -uo pipefail
          ZIP=$(ls zygisk/release/LeafCore-v*-Release.zip | head -1)
          rm -rf /tmp/scan && mkdir -p /tmp/scan
          unzip -o -q "$ZIP" -d /tmp/scan
          fail=0

          # The binaries carry the strings a scanner would grep for: the dex class names
          # (framework dex, manager, daemon) and the module's own shell scripts.
          BINS="/tmp/scan/framework/core.dex /tmp/scan/manager.apk /tmp/scan/daemon.apk"
          TEXTS=$(find /tmp/scan -maxdepth 1 -type f \( -name "*.prop" -o -name "*.sh" -o -name "*.md" \))

          # FAIL 1: upstream author and project name, anywhere, text or binary.
          hits=$(grep -rIl -E "JingMatrix" /tmp/scan || true)
          if [ -n "$hits" ]; then echo "::error::JingMatrix 残留文本：$hits"; fail=1; fi
          for f in $BINS; do
            [ -f "$f" ] || continue
            if strings "$f" | grep -q "JingMatrix"; then echo "::error::JingMatrix 残留于 $f"; fail=1; fi
          done

          # FAIL 2: the upstream package root. This is the strongest single fingerprint and
          # the one a decompiler finds first, so it must never come back.
          for f in $BINS $(find /tmp/scan -maxdepth 1 -type f); do
            [ -f "$f" ] || continue
            if strings "$f" 2>/dev/null | grep -qE "org[./]matrix"; then
              echo "::error::上游包名残留于 $f"; fail=1
            fi
          done

          # FAIL 3: upstream module name / store hosts in the metadata and install scripts.
          for f in $TEXTS; do
            [ -f "$f" ] || continue
            if grep -qiE "vector|lsposed|modules\.lsposed\.org" "$f"; then
              echo "::error::$(basename "$f") 含上游品牌字面量"; fail=1
            fi
          done

          # FAIL 4: no request may name the upstream store from inside the apks.
          for f in /tmp/scan/manager.apk /tmp/scan/daemon.apk; do
            [ -f "$f" ] || continue
            if strings "$f" | grep -q "lsposed\.org"; then echo "::error::商店域名残留于 $f"; fail=1; fi
          done

          # FAIL 5: the old icon's identifiers. The launcher icon is this project's most public
          # surface — it is the one thing standing next to the phone can identify — and deleting
          # the drawable is not enough, because its name survives in resources.arsc and a
          # decompiler reads it. `resources.arsc` is stored uncompressed in an apk, which is why
          # this greps it directly instead of grepping the zip, whose entries are deflated.
          for f in /tmp/scan/manager.apk /tmp/scan/daemon.apk; do
            [ -f "$f" ] || continue
            if unzip -p "$f" resources.arsc 2>/dev/null | strings | grep -qiE "winged|samothrace|statue"; then
              echo "::error::品牌图标标识残留于 $f"; fail=1
            fi
          done

          # WARN: expected to be present forever — the Xposed API contract modules compile against.
          if strings /tmp/scan/framework/core.dex | grep -q "de/robv/android/xposed"; then
            echo "::notice::de.robv.android.xposed 存在（模块兼容性契约，预期）"
          fi

          # WARN: the identity we intend to ship. Printed so a diff in the log shows what changed.
          for f in $BINS; do
            [ -f "$f" ] || continue
            n=$(strings "$f" | grep -c "io\.leafcore" || true)
            echo "::notice::$f: io.leafcore 命中 $n 处"
          done

          exit $fail

      - name: Prepare artifact
        id: artifact
        run: |
          ZIP=$(ls zygisk/release/LeafCore-v*-Release.zip | head -1)
          NAME=$(basename "$ZIP")
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "### $NAME" >> $GITHUB_STEP_SUMMARY
          echo "sha256: \`$SHA\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload module
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: zygisk/release/LeafCore-v*-Release.zip
